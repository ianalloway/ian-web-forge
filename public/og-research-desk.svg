    <path d="M0 354V43M0 354H443" fill="none" stroke="#f3f1e8" stroke-opacity=".22"/>
    <path d="M0 292H443M0 230H443M0 168H443M0 106H443M88 43V354M177 43V354M266 43V354M354 43V354" fill="none" stroke="#f3f1e8" stroke-opacity=".08"/>
    <path d="M18 335L416 66" fill="none" stroke="#f3f1e8" stroke-opacity=".2" stroke-dasharray="6 10"/>
    <path d="M18 334C67 322 91 288 132 290C178 293 188 240 233 248C280 257 291 185 334 195C377 205 383 110 416 75" fill="none" stroke="url(#signal)" stroke-width="5"/>
