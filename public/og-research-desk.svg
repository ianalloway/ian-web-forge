<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Ian Alloway — ML Engineer and Data Scientist</title>
  <desc id="description">A research-desk inspired portfolio card with a calibration trace and the statement systems that make the right call when the data gets noisy.</desc>
  <defs>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#f3f1e8" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d7ff5f" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#d7ff5f"/>
      <stop offset="1" stop-color="#ecffad"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d7ff5f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d7ff5f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0c0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="978" cy="200" r="330" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#f3f1e8" stroke-opacity=".14"/>

  <g transform="translate(64 60)">
    <rect width="54" height="54" rx="7" fill="#11130e" stroke="#d7ff5f"/>
    <path d="M12 12V43M11 42H44" fill="none" stroke="#747866" stroke-width="1.5"/>
    <path d="M13 37C19 36 21 31 26 32C31 33 33 25 38 26C42 27 43 18 47 14" fill="none" stroke="#d7ff5f" stroke-width="3" stroke-linecap="square" stroke-linejoin="round"/>
