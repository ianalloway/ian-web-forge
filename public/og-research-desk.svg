  </g>
  <text x="138" y="81" fill="#f3f1e8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-.3">IAN ALLOWAY</text>
  <text x="138" y="105" fill="#9a9e8c" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.7">RESEARCH DESK / APPLIED ML</text>

  <text x="64" y="222" fill="#f3f1e8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-4">Ian</text>
  <text x="64" y="304" fill="#f3f1e8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-4">Alloway<tspan fill="#d7ff5f">.</tspan></text>
  <text x="67" y="355" fill="#d7ff5f" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="1.8">ML ENGINEER · DATA SCIENTIST · USF M.S. AI</text>

  <g transform="translate(681 80)">
