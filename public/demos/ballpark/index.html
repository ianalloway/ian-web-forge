<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ballpark</title>
<script>/* relative assets need a trailing slash on the folder URL */if(!/\/$|\.html$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash);</script>
<meta name="description" content="A live party game for 2–8 players: everyone guesses the number, closest guess scores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column like a stadium scoreboard; a big lit number panel is the hero of every screen. */
:root{
  --field:#0b261d;      /* page ground, deep outfield */
  --board:#113428;      /* panels */
  --board-2:#174536;    /* raised rows */
  --chalk:#f1ede0;      /* primary text, chalk line */
  --chalk-dim:#a9b8ad;  /* secondary text */
  --bulb:#ffb627;       /* scoreboard bulbs: numbers, primary buttons */
  --clay:#d9774a;       /* infield clay: alerts, timer running low */
  --line:rgba(241,237,224,.14);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#0b261d}
body{
  background:var(--field);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 64px,transparent 64px 128px);
  color:var(--chalk);font:16px/1.5 var(--body);
  padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
main{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1,h2,.num{font-family:var(--display);letter-spacing:.01em;margin:0;line-height:1}
h1{font-size:clamp(56px,16vw,92px);font-weight:900;text-transform:uppercase}
h2{font-size:30px;font-weight:800;text-transform:uppercase}
p{margin:0}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--chalk-dim)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim)}
.panel{background:var(--board);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.lit{color:var(--bulb);text-shadow:0 0 18px rgba(255,182,39,.35)}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input{
  font:600 20px var(--body);color:var(--chalk);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;
}
input:focus{outline:none;border-color:var(--bulb)}
input.code{font-family:var(--display);font-size:32px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
button{
  font:800 20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  border-radius:10px;padding:14px 18px;border:1.5px solid var(--bulb);background:var(--bulb);color:#1d1503;
}
button.ghost{background:transparent;color:var(--chalk);border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.rules{display:grid;gap:8px;padding:0;margin:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:8px;color:var(--chalk)}
.rules li::before{content:counter(r);font:800 22px/1.1 var(--display);color:var(--bulb)}
.players{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.players li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--board-2);border-radius:8px;padding:9px 12px;min-width:0}
.players .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tag{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);white-space:nowrap}
.tag.ok{color:var(--bulb)}
.tag.off{color:var(--clay)}
.score{font:800 26px var(--display);color:var(--bulb);font-variant-numeric:tabular-nums}
.q{font:700 clamp(24px,6vw,32px)/1.2 var(--body);text-wrap:balance}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font:900 44px var(--display);font-variant-numeric:tabular-nums;color:var(--bulb)}
.clock.low{color:var(--clay)}
.answer{display:grid;gap:4px;text-align:center;padding:18px;border-radius:12px;background:#08201a;border:1px solid var(--line)}
.answer .num{font-size:clamp(52px,15vw,84px);font-weight:900}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);text-align:left;padding:6px 6px}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td .name{font-weight:600;word-break:break-word}
.pts{font:800 22px var(--display);color:var(--bulb)}
.you{font:700 10px var(--body);letter-spacing:.1em;color:#1d1503;background:var(--chalk);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.note{color:var(--chalk-dim);font-size:14px}
.err{color:var(--clay);font-weight:600;font-size:14px;min-height:1em}
.share{display:flex;gap:8px;align-items:stretch}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--chalk-dim)}
.share button{flex:none;font-size:16px;padding:8px 14px}
.bigcode{font:900 64px/1 var(--display);letter-spacing:.18em;color:var(--bulb);text-shadow:0 0 18px rgba(255,182,39,.35)}
.podium{display:grid;gap:6px;text-align:center}
.podium .num{font-size:56px;font-weight:900}
.waiting{display:flex;align-items:center;gap:10px;color:var(--chalk-dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bulb);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
footer{text-align:center;color:var(--chalk-dim);font-size:12px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="mqtt.min.js"></script>
<script>
"use strict";
/* ---------------- Question bank: stable facts with numeric answers ---------------- */
const QUESTIONS = [
  {q:"How many keys are on a standard piano?", a:88},
  {q:"How many bones are in the adult human body?", a:206},
  {q:"In what year did the Berlin Wall fall?", a:1989},
  {q:"How many member states are in the United Nations?", a:193},
  {q:"How tall is Mount Everest, in meters?", a:8849},
  {q:"At sea level, water boils at how many degrees Fahrenheit?", a:212},
  {q:"In what year was the first iPhone released?", a:2007},
  {q:"How long is a marathon, in miles?", a:26.2},
  {q:"In what year did the Titanic sink?", a:1912},
  {q:"How many teeth are in a full adult set, wisdom teeth included?", a:32},
  {q:"How many seconds are in one day?", a:86400},
  {q:"In what year did humans first land on the Moon?", a:1969},
  {q:"How many elements are on the periodic table?", a:118},
  {q:"How many hearts does an octopus have?", a:3},
  {q:"How many justices sit on the U.S. Supreme Court?", a:9},
  {q:"In what year was William Shakespeare born?", a:1564},
  {q:"How many countries are in Africa (UN members)?", a:54},
  {q:"In what year did the Wright brothers make their first powered flight?", a:1903},
  {q:"How many bones are in one human hand?", a:27},
  {q:"How many feet are in a mile?", a:5280},
  {q:"How many amendments does the U.S. Constitution have?", a:27},
  {q:"How many minutes are in a week?", a:10080},
  {q:"At what temperature do Fahrenheit and Celsius read the same?", a:-40},
  {q:"In what year was the Eiffel Tower completed?", a:1889},
  {q:"How many U.S. states border Canada?", a:13},
  {q:"What is a perfect score in ten-pin bowling?", a:300},
  {q:"How long is an Olympic swimming pool, in meters?", a:50},
  {q:"In what year were the first modern Olympic Games held?", a:1896},
  {q:"How many squares are on a chessboard?", a:64},
  {q:"How many moons does Mars have?", a:2},
  {q:"How many players does each team have on the field in soccer?", a:11},
  {q:"How many time zones does Russia span?", a:11},
  {q:"Roughly how far is the Moon from Earth on average, in miles?", a:238900},
  {q:"Light travels about how many kilometers in one second?", a:299792},
  {q:"How many strings does a violin have?", a:4},
  {q:"How many hours are in a non-leap year?", a:8760},
];
const ROUNDS = 8, ROUND_MS = 35000, MAX_PLAYERS = 8;
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const LOCAL = new URLSearchParams(location.search).has("local"); // same-browser test mode, no network

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, q) => esc(Number(n).toLocaleString("en-US", {maximumFractionDigits: 2, useGrouping: !/\byear\b/i.test(q||"")})); // no "1,903" for years
const parseGuess = s => { const t = String(s).replace(/[,\s]/g, ""); if (!/^-?\d*\.?\d+$/.test(t)) return null; const n = Number(t); return Number.isFinite(n) ? n : null; };
const randCode = () => Array.from({length:4}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
/* ---------------- untrusted input ----------------
   The relay is public, so anyone who knows the room code can publish to its topics. Every game
   state is checked against a strict schema and rebuilt from known fields before it is rendered,
   and every value that reaches innerHTML goes through esc().                                    */
const PHASES = ["lobby","question","reveal","final"];
const ID_RE = /^[0-9a-f]{32}$/;    // player ids are key fingerprints, see "identity" below
const isId = x => typeof x==="string" && ID_RE.test(x);
const isStr = (x, max) => typeof x==="string" && x.length<=max;
const isInt = (x, lo, hi) => Number.isInteger(x) && x>=lo && x<=hi;
const isNum = (x, lo, hi) => typeof x==="number" && Number.isFinite(x) && x>=lo && x<=hi;
const isObj = x => !!x && typeof x==="object" && !Array.isArray(x);
const MAXN = Number.MAX_VALUE;
function validPlayer(p){
  if(!isObj(p) || !isId(p.id) || !isStr(p.name,20) || !isInt(p.score,0,1e6) || !isInt(p.last,0,5)
     || typeof p.online!=="boolean" || typeof p.guessed!=="boolean") return null;
  return {id:p.id, name:p.name, score:p.score, last:p.last, online:p.online, guessed:p.guessed};
}
function validResult(x){
  if(!isObj(x) || !isId(x.id) || !isStr(x.name,20) || !isInt(x.pts,0,5)) return null;
  const missed = x.guess===null;
  if(missed ? (x.diff!==null || x.place!==null)
            : (!isNum(x.guess,-MAXN,MAXN) || !isNum(x.diff,0,MAXN) || !isInt(x.place,1,MAX_PLAYERS))) return null;
  return {id:x.id, name:x.name, guess:x.guess, diff:x.diff, place:x.place, pts:x.pts};
}
/* returns a clean copy of a game state, or null if anything is missing, mistyped or out of range */
function validState(s){
  if(!isObj(s) || typeof s.code!=="string" || !/^[A-Z]{4}$/.test(s.code) || !PHASES.includes(s.phase) || !isId(s.host)) return null;
  if(!isInt(s.total,1,100) || !isInt(s.round,0,s.total) || !isInt(s.v,0,Number.MAX_SAFE_INTEGER) || !isNum(s.msLeft,0,ROUND_MS)) return null;
  if(!Array.isArray(s.players) || s.players.length<1 || s.players.length>MAX_PLAYERS) return null;
  const players = s.players.map(validPlayer);
  if(players.includes(null) || new Set(players.map(p=>p.id)).size!==players.length) return null;
  const needQ = s.phase==="question" || s.phase==="reveal";
  if(needQ ? !(isStr(s.q,300) && s.q) : !(s.q===null || isStr(s.q,300))) return null;
  let reveal = null;
  if(s.phase==="reveal"){
    const r = s.reveal;
    if(!isObj(r) || !isNum(r.answer,-MAXN,MAXN) || !Array.isArray(r.results) || r.results.length>MAX_PLAYERS) return null;
    const results = r.results.map(validResult);
    if(results.includes(null)) return null;
    reveal = {answer:r.answer, results};
  }
  return {code:s.code, phase:s.phase, host:s.host, players, round:s.round, total:s.total,
          q:needQ ? s.q : null, msLeft:s.msLeft, reveal, v:s.v};
}
function savedName(){ try{ return localStorage.getItem("bp-name")||""; }catch(e){ return ""; } }
function saveName(n){ try{ localStorage.setItem("bp-name",n); }catch(e){} }

/* ---------------- identity: everything sent over the relay is signed ----------------
   Each tab makes an ECDSA P-256 key pair. The private key stays in this tab (sessionStorage, so a
   refresh keeps your seat) and is never published. A player's id is a fingerprint of their public
   key (first 128 bits of its SHA-256), so a seat is bound to one key and nobody else can sign for it.
   Players sign every message to the host with a fresh timestamp (the host drops anything not newer
   than the last one it accepted, so replays fail), and the host signs every state and dm. Players
   pin the host key from the first validly signed state of the room and ignore any other signer.  */
const SIG = {name:"ECDSA", namedCurve:"P-256"}, SIGN = {name:"ECDSA", hash:"SHA-256"};
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const utf8 = s => new TextEncoder().encode(s);
async function fingerprint(pubB64){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", unb64(pubB64)));
  return Array.from(h.slice(0,16), b => b.toString(16).padStart(2,"0")).join("");
}
const pubKeys = new Map();
function importPub(pubB64){
  if(!pubKeys.has(pubB64)) pubKeys.set(pubB64, crypto.subtle.importKey("raw", unb64(pubB64), SIG, false, ["verify"]));
  return pubKeys.get(pubB64);
}
let ME = "", MYPUB = "", MYKEY = null;
async function loadIdentity(){
  let kp = null;
  try{
    const saved = JSON.parse(sessionStorage.getItem("bp-id"));
    if(saved) kp = {privateKey: await crypto.subtle.importKey("jwk", saved.priv, SIG, false, ["sign"]),
                    publicKey: await crypto.subtle.importKey("jwk", saved.pub, SIG, true, ["verify"])};
  }catch(e){ kp = null; }
  if(!kp){
    kp = await crypto.subtle.generateKey(SIG, true, ["sign","verify"]);
    try{ sessionStorage.setItem("bp-id", JSON.stringify({priv: await crypto.subtle.exportKey("jwk", kp.privateKey),
                                                         pub: await crypto.subtle.exportKey("jwk", kp.publicKey)})); }catch(e){}
  }
  MYKEY = kp.privateKey;
  MYPUB = b64(await crypto.subtle.exportKey("raw", kp.publicKey));
  ME = await fingerprint(MYPUB);
}
const identity = loadIdentity();
identity.catch(()=>{});  // reported when hosting or joining
/* a signed envelope: b is the JSON body, g the signature over it, k the signer's public key */
async function seal(body){
  const b = JSON.stringify(body);
  return {b, g: b64(await crypto.subtle.sign(SIGN, MYKEY, utf8(b))), k: MYPUB};
}
/* returns the parsed body if env is validly signed by the key it names and that key's fingerprint is
   expectId (or the key is exactly expectKey); otherwise null */
async function unseal(env, {expectId, expectKey}){
  try{
    if(!isObj(env) || !isStr(env.b,20000) || !isStr(env.g,200) || !isStr(env.k,200)) return null;
    if(expectKey ? env.k!==expectKey : (await fingerprint(env.k))!==expectId) return null;
    if(!(await crypto.subtle.verify(SIGN, await importPub(env.k), unb64(env.g), utf8(env.b)))) return null;
    return JSON.parse(env.b);
  }catch(e){ return null; }
}

/* ---------------- transport: MQTT relay over secure WebSockets (real) or BroadcastChannel (?local) ----------------
   Topics under ballpark-ia/v1/<CODE>/
     alive  retained, the host's id while the room is open ("" once it closes; also the host's last will)
     state  retained, the full public game state, published by the host on every change (signed)
     up     player -> host messages, each signed by the sender (see "identity")
     dm/<id> host -> one player (only "room full", signed)                                             */
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const topic = (code, t) => `ballpark-ia/v1/${code}/${t}`;
function mq(will){
  return mqtt.connect(BROKER, {clientId:"bp_"+Math.random().toString(36).slice(2,12), clean:true, keepalive:15,
    reconnectPeriod:2000, connectTimeout:10000, will});
}
function connected(c){
  return new Promise((res, rej) => { const t=setTimeout(()=>rej({type:"timeout"}),12000); c.once("connect",()=>{clearTimeout(t);res();}); });
}
const enc = o => JSON.stringify(o);
const dec = b => { try{ const s=b.toString(); return s?JSON.parse(s):null; }catch(e){ return null; } };

/* host: openHost(code, onUp) -> {state(s), dm(id,d), close()} ; rejects {type:"taken"} if the code is in use */
async function openHost(code, onUp){
  if (LOCAL){
    const ch = new BroadcastChannel("bp-"+code);
    ch.onmessage = e => { const m=e.data; if(m.k==="up") onUp(m.d); else if(m.k==="hello" && last) ch.postMessage({k:"state",d:last}); };
    let last=null;
    return { state:s=>{last=s; ch.postMessage({k:"state",d:s});}, dm:(id,d)=>ch.postMessage({k:"dm",id,d}),
             close:()=>{ ch.postMessage({k:"gone"}); ch.close(); } };
  }
  const c = mq({topic:topic(code,"alive"), payload:"", qos:1, retain:true});
  await connected(c);
  // is this code already taken by a live room?
  const taken = await new Promise(res => {
    const t = setTimeout(()=>res(false), 1500);
    c.on("message", (tp, b) => { if(tp===topic(code,"alive") && b.length){ clearTimeout(t); res(true); } });
    c.subscribe(topic(code,"alive"), {qos:1});
  });
  c.removeAllListeners("message"); c.unsubscribe(topic(code,"alive"));
  if (taken){ c.end(true); throw {type:"taken"}; }
  let last = null;
  const announce = () => { c.publish(topic(code,"alive"), ME, {qos:1, retain:true}); if(last) c.publish(topic(code,"state"), enc(last), {qos:1, retain:true}); };
  c.subscribe(topic(code,"up"), {qos:1});
  c.on("message", (tp, b) => { if(tp===topic(code,"up")){ const m=dec(b); if(m) onUp(m); } });
  c.on("connect", announce);            // re-assert the room after any reconnect
  announce();
  return {
    state: s => { last=s; c.publish(topic(code,"state"), enc(s), {qos:1, retain:true}); },
    dm: (id,d) => c.publish(topic(code,"dm/"+id), enc(d), {qos:1}),
    close: () => { c.publish(topic(code,"alive"), "", {qos:1, retain:true}); c.publish(topic(code,"state"), "", {qos:1, retain:true}); setTimeout(()=>c.end(),300); }
  };
}

/* player: openClient(code, handlers) -> {send(d)} ; rejects {type:"not-found"} when no live room has that code */
async function openClient(code, h){
  if (LOCAL){
    const ch = new BroadcastChannel("bp-"+code);
    ch.onmessage = e => { const m=e.data; if(m.k==="state") h.state(m.d); else if(m.k==="dm"&&m.id===ME) h.dm(m.d); else if(m.k==="gone") h.gone(); };
    const api = { send:d=>ch.postMessage({k:"up",d}) };
    ch.postMessage({k:"hello"});
    return api;
  }
  const c = mq();  // no last will: a will can't carry a fresh signature, so a dropped player times out instead
  await connected(c);
  let alive = false, goneTimer = null, found;
  const foundP = new Promise(r => found = r);
  c.on("message", (tp, b) => {
    if (tp===topic(code,"alive")){
      if (b.length){ alive=true; clearTimeout(goneTimer); found(true); }
      else if (alive){ clearTimeout(goneTimer); goneTimer=setTimeout(h.gone, 8000); } // allow a host reconnect
    } else if (tp===topic(code,"state")){ const s=dec(b); if(s) h.state(s); }
    else if (tp===topic(code,"dm/"+ME)){ const d=dec(b); if(d) h.dm(d); }
  });
  c.subscribe([topic(code,"alive"), topic(code,"state"), topic(code,"dm/"+ME)], {qos:1});
  setTimeout(()=>found(false), 4000);
  if (!(await foundP)){ c.end(true); throw {type:"not-found"}; }
  const api = { send: d => c.publish(topic(code,"up"), enc(d), {qos:1}) };
  c.on("connect", () => h.reconnected && h.reconnected());
  return api;
}

/* ---------------- app state ---------------- */
let view = {screen:"home", error:"", joinCode:(location.hash.slice(1)||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4)};
let pub = null;          // public game state from host
let net = null;          // player connection
let isHost = false;
let tick = null, recvAt = 0, myName = "", joinTimer = null;

/* ---------------- host engine (the host's browser is the referee) ---------------- */
const Host = {
  code:null, t:null, s:null, guesses:{}, deck:[], timer:null, seen:{}, lastTs:{}, inbox:Promise.resolve(), outbox:Promise.resolve(),
  async start(name){
    for (let tries=0; tries<5 && !this.t; tries++){
      const code = randCode();
      try{ this.t = await openHost(code, m=>this.onUp(m)); this.code = code; }
      catch(err){ if(!(err && err.type==="taken")) throw err; }
    }
    if(!this.t) throw new Error("no code");
    this.s = {code:this.code, phase:"lobby", host:ME, players:[{id:ME,name,score:0,online:true,guessed:false,last:0}], round:0, total:ROUNDS, q:null, msLeft:0, reveal:null, v:0};
    isHost = true; this.push();
    setInterval(()=>this.sweep(), 5000);
    addEventListener("pagehide", ()=>this.t.close());
  },
  onUp(env){ this.inbox = this.inbox.then(()=>this.receive(env)).catch(()=>{}); },  // one at a time, in order
  async receive(env){
    let m; try{ m = JSON.parse(env && env.b); }catch(e){ return; }
    if(!isObj(m) || m.room!==this.code || !isId(m.from) || m.from===ME) return;
    if(!isNum(m.ts,0,Number.MAX_SAFE_INTEGER) || m.ts<=(this.lastTs[m.from]||0)) return;  // stale or replayed
    if(!(await unseal(env, {expectId:m.from}))) return;  // not signed by the key this id belongs to
    this.lastTs[m.from] = m.ts;
    const key = m.from;
    this.seen[key] = Date.now();
    const p = this.s.players.find(p=>p.id===key);
    if(m.t==="join"){
      const name = String(m.name||"").trim().slice(0,20) || "Player";
      if(!p){
        if(this.s.players.length>=MAX_PLAYERS){ seal({t:"full", to:key, room:this.code}).then(d=>this.t.dm(key,d)); return; }
        this.s.players.push({id:key,name,score:0,online:true,guessed:false,last:0});
      } else { p.online = true; p.name = name; }
      this.push();
    } else if(m.t==="guess"){ this.guess(key, m.v); }
    else if(m.t==="hb"){ if(p && !p.online){ p.online=true; this.push(); } }
    else if(m.t==="bye"){ if(p && p.online){ p.online=false; this.push(); this.maybeReveal(); } }
  },
  sweep(){ // players send a heartbeat every 5s; 20s of silence marks them offline
    let changed=false; const now=Date.now();
    this.s.players.forEach(p=>{ if(p.id!==ME && p.online && now-(this.seen[p.id]||0)>20000){ p.online=false; changed=true; } });
    if(changed){ this.push(); this.maybeReveal(); }
  },
  online(){ return this.s.players.filter(p=>p.online); },
  begin(){
    if(this.online().length<2) return;
    this.deck = shuffle(QUESTIONS).slice(0,ROUNDS);
    this.s.players.forEach(p=>{p.score=0;p.last=0;});
    this.s.round=0; this.next();
  },
  next(){
    if(this.s.round>=ROUNDS){ this.s.phase="final"; this.s.q=null; this.push(); return; }
    const item = this.deck[this.s.round];
    this.s.round++; this.s.phase="question"; this.s.q=item.q; this.s.reveal=null;
    this.guesses={}; this.s.players.forEach(p=>{p.guessed=false;p.last=0;});
    this.deadline = Date.now()+ROUND_MS;
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.doReveal(), ROUND_MS);
    this.push();
  },
  guess(key, v){
    if(this.s.phase!=="question") return;
    const n = typeof v==="number" && Number.isFinite(v) ? v : null;
    const p = this.s.players.find(p=>p.id===key);
    if(n===null || !p || key in this.guesses) return;
    this.guesses[key]=n; p.guessed=true; this.push(); this.maybeReveal();
  },
  maybeReveal(){
    if(this.s.phase==="question" && this.online().every(p=>p.id in this.guesses)) this.doReveal();
  },
  doReveal(){
    if(this.s.phase!=="question") return;
    clearTimeout(this.timer);
    const a = this.deck[this.s.round-1].a;
    const rows = this.s.players.map(p=>({id:p.id,name:p.name,guess:(p.id in this.guesses)?this.guesses[p.id]:null}));
    const guessed = rows.filter(r=>r.guess!==null).map(r=>({...r,diff:Math.abs(r.guess-a)})).sort((x,y)=>x.diff-y.diff);
    // standard competition ranking: ties share a place
    let place=0, prev=null;
    guessed.forEach((r,i)=>{ if(prev===null||r.diff!==prev){place=i+1;prev=r.diff;} r.place=place; r.pts=(place===1?3:place===2?1:0)+(r.diff===0?2:0); });
    const missed = rows.filter(r=>r.guess===null).map(r=>({...r,diff:null,place:null,pts:0}));
    const results = guessed.concat(missed);
    results.forEach(r=>{ const p=this.s.players.find(p=>p.id===r.id); p.score+=r.pts; p.last=r.pts; });
    this.s.phase="reveal"; this.s.reveal={answer:a, results};
    this.push();
  },
  push(){
    this.s.msLeft = this.s.phase==="question" ? Math.max(0,this.deadline-Date.now()) : 0;
    this.s.v++;
    const snap = JSON.parse(JSON.stringify(this.s));
    this.outbox = this.outbox.then(async()=>this.t.state(await seal(snap))).catch(()=>{});  // signed, in order
    onState(snap);
  }
};

/* ---------------- player side ---------------- */
let hostKey = null;       // the host's public key, pinned from the first validly signed state
async function fromHost(env){
  if(hostKey) return unseal(env, {expectKey:hostKey});
  let body; try{ body = JSON.parse(env && env.b); }catch(e){ return null; }
  if(!isObj(body) || !isId(body.host) || body.code!==view.joinCode) return null;
  const s = await unseal(env, {expectId:body.host});
  if(s && !hostKey) hostKey = env.k;
  return s;
}
async function onSignedState(env){ const s = await fromHost(env); if(s) onState(s); }
let lastTs = 0, byeEnv = null, outbox = Promise.resolve();
/* sign and send in order; also keep a signed "bye" ready, because pagehide can't wait for crypto */
function sendUp(d){
  const room = view.joinCode;
  outbox = outbox.then(async()=>{
    lastTs = Math.max(lastTs+1, Date.now());
    net.send(await seal({...d, from:ME, room, ts:lastTs}));
    byeEnv = await seal({t:"bye", from:ME, room, ts:lastTs+1});
  }).catch(()=>{});
}
function onState(raw){
  const s = validState(raw);
  if(!s) return;                                      // malformed or hostile state: drop it
  if(s.code!==(isHost ? Host.code : view.joinCode)) return;  // only the room we are in
  if(pub && s.code===pub.code && s.v<pub.v) return;  // ignore an older retained copy
  pub = s; recvAt = Date.now(); view.error="";
  if(!isHost){
    const inGame = s.players.some(p=>p.id===ME);
    if(!inGame){ return; }            // keep "Connecting…" until the host has added us
    clearInterval(joinTimer); joinTimer=null;
  }
  view.screen = "game";
  try{ history.replaceState(null,"","#"+s.code); }catch(e){}
  render();
}
async function hostGame(){
  const name = ($("#name").value||"").trim();
  if(!name){ view.error="Enter your name first."; return render(); }
  saveName(name); view.screen="connecting"; render();
  try{ await identity; }catch(e){ view.screen="home"; view.error="This browser can't sign game messages. Open the game over https in a current browser."; return render(); }
  try{ await Host.start(name.slice(0,20)); }
  catch(e){ view.screen="home"; view.error="Couldn't open a game room. Check your connection and try again."; render(); }
}
async function joinGame(){
  const name = ($("#name").value||"").trim();
  const code = ($("#code").value||"").toUpperCase().replace(/[^A-Z]/g,"");
  if(!name){ view.error="Enter your name first."; return render(); }
  if(code.length!==4){ view.error="Room codes are 4 letters."; return render(); }
  saveName(name); myName=name.slice(0,20); view.joinCode=code; view.screen="connecting"; render();
  hostKey = null; pub = null; byeEnv = null;          // a new room: forget the last room's host pin
  try{ await identity; }catch(e){ view.screen="home"; view.error="This browser can't sign game messages. Open the game over https in a current browser."; return render(); }
  try{
    net = await openClient(code, {
      state: onSignedState,
      dm: async env => {
        if(!hostKey) return;
        const m = await unseal(env, {expectKey:hostKey});
        if(m && m.t==="full" && m.to===ME && m.room===code){ clearInterval(joinTimer); view.screen="home"; view.error="That game is full (8 players max)."; render(); }
      },
      gone: () => { view.screen="ended"; render(); },
      reconnected: () => net && sendUp({t:"join", name:myName})
    });
    const hello = () => sendUp({t:"join", name:myName});
    hello(); joinTimer = setInterval(hello, 3000);        // repeat until the host lists us
    setInterval(()=>sendUp({t:"hb"}), 5000);
    addEventListener("pagehide", () => { if(byeEnv) net.send(byeEnv); });
    setTimeout(()=>{ if(view.screen==="connecting"){ clearInterval(joinTimer); view.screen="home"; view.error="The host didn't respond. Check the code and try again."; render(); } }, 15000);
  }catch(e){
    view.screen="home";
    view.error = e && e.type==="not-found" ? `No open game with code ${code}. Check the code with your host.` : "Couldn't reach the game server. Check your connection and try again.";
    render();
  }
}
function sendGuess(){
  const v = parseGuess($("#guess").value);
  if(v===null){ $("#gerr").textContent="Type a number, like 1200 or 26.2"; return; }
  if(isHost) Host.guess(ME, v); else { sendUp({t:"guess", v}); $("#gBtn").disabled=true; $("#gBtn").textContent="Sending…"; }
}
function copyLink(){
  const link = location.origin+location.pathname+location.search+"#"+pub.code;
  const btn=$("#copy");
  const done=()=>{btn.textContent="Copied"; setTimeout(()=>btn.textContent="Copy",1500);};
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(done,()=>{});
}

/* ---------------- rendering ---------------- */
const RULES = `<ol class="rules">
  <li><span>One player hosts and gets a 4-letter room code. Everyone else joins with that code on their own phone or computer.</span></li>
  <li><span>Each round shows a question whose answer is a number. Type your best guess before the 35-second clock runs out. Guesses stay hidden until everyone is in.</span></li>
  <li><span>Closest guess scores <b>3 points</b>, second closest scores <b>1</b>. Hit the answer exactly for <b>+2 bonus</b>. Ties share the place.</span></li>
  <li><span>After ${ROUNDS} rounds, the highest score wins.</span></li>
</ol>`;

function render(){
  const app=$("#app"); clearInterval(tick);
  const head = `<div class="brand"><h1 class="lit">Ballpark</h1><small>Closest guess wins</small></div>`;
  if(view.screen==="home"){
    app.innerHTML = `${head}
    <section class="panel">
      <label for="name">Your name<input id="name" maxlength="20" autocomplete="nickname" value="${esc(savedName())}" placeholder="e.g. Jordan"></label>
      <button id="hostBtn">Host a new game</button>
    </section>
    <section class="panel">
      <span class="eyebrow">Have a room code?</span>
      <div class="row">
        <input id="code" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Room code" placeholder="CODE" value="${esc(view.joinCode)}">
        <button id="joinBtn" class="ghost">Join game</button>
      </div>
    </section>
    <p class="err" role="alert">${esc(view.error)}</p>
    <section class="panel"><h2>How to play</h2>${RULES}<p class="note">2 to 8 players, each on their own device.</p></section>
    <footer>Ballpark · a party game of educated guesses</footer>`;
    $("#hostBtn").onclick=hostGame; $("#joinBtn").onclick=joinGame;
    $("#code").onkeydown=e=>{ if(e.key==="Enter") joinGame(); };
    return;
  }
  if(view.screen==="connecting"){ app.innerHTML=`${head}<section class="panel"><div class="waiting"><span class="dot"></span>Connecting…</div></section>`; return; }
  if(view.screen==="ended"){
    app.innerHTML=`${head}<section class="panel"><h2>The host left</h2><p class="note">This game has ended because the host closed their page. Start a new one any time.</p><button id="home">Back to start</button></section>`;
    $("#home").onclick=()=>{ location.hash=""; location.reload(); }; return;
  }
  const s=pub, me=s.players.find(p=>p.id===ME);
  const playerList = (showGuess)=>`<ul class="players">${s.players.map(p=>`<li>
      <span class="name">${esc(p.name)}${p.id===ME?'<span class="you">YOU</span>':''}${p.id===s.host?' <span class="tag">host</span>':''}</span>
      ${!p.online?'<span class="tag off">offline</span>': showGuess ? (p.guessed?'<span class="tag ok">locked in</span>':'<span class="tag">thinking…</span>') : `<span class="score">${esc(p.score)}</span>`}
    </li>`).join("")}</ul>`;

  if(s.phase==="lobby"){
    const n = s.players.filter(p=>p.online).length;
    app.innerHTML = `${head}
    <section class="panel" style="text-align:center">
      <span class="eyebrow">Room code</span>
      <div class="bigcode">${esc(s.code)}</div>
      <div class="share"><code>${esc(location.origin+location.pathname+location.search+"#"+s.code)}</code><button id="copy" class="ghost">Copy</button></div>
      <p class="note">Players open this page and enter the code, or open the link directly.</p>
    </section>
    <section class="panel">
      <div class="meta"><h2>Players</h2><span class="tag">${n} / ${MAX_PLAYERS}</span></div>
      ${playerList(false)}
      ${isHost ? `<button id="startBtn" ${n<2?"disabled":""}>Start game</button>${n<2?'<p class="note">Waiting for at least one more player to join.</p>':''}`
               : `<div class="waiting"><span class="dot"></span>Waiting for the host to start…</div>`}
    </section>
    <section class="panel"><h2>How to play</h2>${RULES}</section>`;
    $("#copy").onclick=copyLink; if(isHost) $("#startBtn").onclick=()=>Host.begin();
    return;
  }
  if(s.phase==="question"){
    const deadline = recvAt + s.msLeft;
    const locked = me && me.guessed;
    app.innerHTML = `${head}
    <section class="panel">
      <div class="meta"><span class="eyebrow">Round ${esc(s.round)} of ${esc(s.total)}</span><span id="clock" class="clock">35</span></div>
      <p class="q">${esc(s.q)}</p>
      ${locked ? `<div class="waiting"><span class="dot"></span>Guess locked in. Waiting for the others…</div>`
      : `<label for="guess">Your guess<input id="guess" inputmode="decimal" autocomplete="off" placeholder="Type a number"></label>
         <button id="gBtn">Lock in guess</button><p id="gerr" class="err" role="alert"></p>`}
    </section>
    <section class="panel">${playerList(true)}${isHost?'<button id="revealBtn" class="ghost">Reveal now</button>':''}</section>`;
    const clock=$("#clock");
    const upd=()=>{ const left=Math.max(0,Math.ceil((deadline-Date.now())/1000)); clock.textContent=left; clock.classList.toggle("low",left<=10); };
    upd(); tick=setInterval(upd,250);
    if(!locked){ $("#gBtn").onclick=sendGuess; const g=$("#guess"); g.onkeydown=e=>{if(e.key==="Enter")sendGuess();}; g.focus(); }
    if(isHost) $("#revealBtn").onclick=()=>Host.doReveal();
    return;
  }
  if(s.phase==="reveal"){
    const r=s.reveal, last=s.round>=s.total;
    app.innerHTML = `${head}
    <section class="panel">
      <span class="eyebrow">Round ${esc(s.round)} of ${esc(s.total)}</span>
      <p class="q">${esc(s.q)}</p>
      <div class="answer"><span class="eyebrow">The answer</span><span class="num lit">${fmt(r.answer, s.q)}</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Player</th><th class="r">Guess</th><th class="r">Off by</th><th class="r">Pts</th></tr></thead>
        <tbody>${r.results.map(x=>`<tr><td><span class="name">${esc(x.name)}</span>${x.id===ME?'<span class="you">YOU</span>':''}</td>
          <td class="r">${x.guess===null?'<span class="note">no guess</span>':fmt(x.guess, s.q)}</td>
          <td class="r">${x.diff===null?'–':x.diff===0?'<b class="lit">EXACT</b>':fmt(x.diff)}</td>
          <td class="r"><span class="pts">${x.pts?'+'+esc(x.pts):'0'}</span></td></tr>`).join("")}</tbody>
      </table></div>
    </section>
    <section class="panel"><div class="meta"><h2>Scoreboard</h2></div>${playerList(false)}
      ${isHost?`<button id="nextBtn">${last?"See final results":"Next question"}</button>`:`<div class="waiting"><span class="dot"></span>Waiting for the host to continue…</div>`}
    </section>`;
    if(isHost) $("#nextBtn").onclick=()=>Host.next();
    return;
  }
  if(s.phase==="final"){
    const ranked=[...s.players].sort((a,b)=>b.score-a.score);
    const top=ranked[0].score, winners=ranked.filter(p=>p.score===top);
    app.innerHTML = `${head}
    <section class="panel podium">
      <span class="eyebrow">Final whistle</span>
      <h2>${winners.length>1?"It's a tie":"Winner"}</h2>
      <div class="num lit">${winners.map(w=>esc(w.name)).join(" & ")}</div>
      <p class="note">${esc(top)} points over ${esc(s.total)} rounds</p>
    </section>
    <section class="panel"><h2>Standings</h2>${`<ul class="players">${ranked.map((p,i)=>`<li><span class="name">${i+1}. ${esc(p.name)}${p.id===ME?'<span class="you">YOU</span>':''}</span><span class="score">${esc(p.score)}</span></li>`).join("")}</ul>`}
      ${isHost?'<button id="againBtn">Play again</button>':'<div class="waiting"><span class="dot"></span>The host can start a rematch.</div>'}
    </section>`;
    if(isHost) $("#againBtn").onclick=()=>Host.begin();
  }
}

/* host closing the tab ends the game for everyone; warn first */
addEventListener("beforeunload", e => { if(isHost && pub && pub.phase!=="lobby"){ e.preventDefault(); e.returnValue=""; } });
render();
</script>
</body>
